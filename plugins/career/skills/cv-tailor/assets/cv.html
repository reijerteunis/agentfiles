<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* One column, real text, standard headings: what applicant tracking systems parse best. */
  @page { size: A4; margin: 16mm 17mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10.2pt; line-height: 1.42; color: #1b1b1f; margin: 0;
    -webkit-print-color-adjust: exact;
  }
  h1 { font-size: 21pt; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2pt; }
  h1 + p { color: #55555e; margin: 0 0 10pt; }
  h2 {
    font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: #1f4e9c; border-bottom: 1px solid #d9d6cc; padding-bottom: 2pt; margin: 13pt 0 6pt;
  }
  h3 { font-size: 10.6pt; font-weight: 700; margin: 9pt 0 3pt; break-after: avoid; }
  p { margin: 0 0 5pt; }
  ul { margin: 0 0 4pt; padding-left: 14pt; }
  li { margin: 0 0 2.5pt; break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
  strong { font-weight: 700; }
</style>
</head>
<body>
{{content}}
</body>
</html>
